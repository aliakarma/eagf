# ============================================================
# EAGF: Ethical AI Governance Framework
# Conda environment specification
# Create with: conda env create -f environment.yml
# Activate with: conda activate eagf
# ============================================================

name: eagf

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ── Python ────────────────────────────────────────────────
  - python=3.10.12

  # ── PyTorch (CUDA 11.8 build) ─────────────────────────────
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - pytorch-cuda=11.8

  # ── Core scientific stack ─────────────────────────────────
  - numpy=1.24.4
  - pandas=2.0.3
  - scipy=1.11.2
  - scikit-learn=1.3.0
  - statsmodels=0.14.0

  # ── Visualisation ─────────────────────────────────────────
  - matplotlib=3.7.2
  - seaborn=0.12.2

  # ── Configuration ─────────────────────────────────────────
  - pyyaml=6.0.1

  # ── Jupyter ───────────────────────────────────────────────
  - jupyter=1.0.0
  - ipykernel=6.25.0
  - ipywidgets=8.1.0
  - nbformat=5.9.2

  # ── Utilities ─────────────────────────────────────────────
  - tqdm=4.66.1
  - pyarrow=12.0.1

  # ── Testing ───────────────────────────────────────────────
  - pytest=7.4.2
  - pytest-cov=4.1.0

  # ── pip-only packages ─────────────────────────────────────
  - pip
  - pip:
    # Differential privacy
    - opacus>=1.4.0
    # Explainability
    - shap>=0.42.0
    # Configuration extensions
    - omegaconf>=2.3.0
    # Experiment tracking
    - mlflow>=2.7.0
    - tensorboard>=2.13.0
    # Cryptographic logging
    - cryptography>=41.0.0
    # RE-IoT simulation
    - tslearn>=0.6.0
    # Model serialisation
    - safetensors>=0.3.3
    # Code quality
    - black>=23.7.0
    - isort>=5.12.0
    - flake8>=6.1.0
    - rich>=13.5.0
    # Dataset download
    - kaggle>=1.5.16

# ── Post-installation instructions ────────────────────────
# After creating the environment:
#   python -m ipykernel install --user --name=eagf --display-name "EAGF (Python 3.10)"
#   pytest tests/ -v --cov=src
